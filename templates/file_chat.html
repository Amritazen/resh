<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resh — Chat with File</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --white:         #FFFFFF;
      --ink:           #1A3A4A;
      --ink-soft:      #5A7A8A;
      --sidebar-bg:    #EAF4FB;
      --sidebar-border: #C5DFF0;
      --sidebar-text:  #1A3A4A;
      --sidebar-muted: #5A7A8A;
      --sidebar-pill-bg: #D6EEF8;
      --sidebar-pill-border: #90C4E0;
      --blue-rich:     #3A8FBF;
      --bot-bubble-bg: #EAF4FB;
      --bot-bubble-border: #C5DFF0;
      --user-bubble-bg: #1A3A4A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--ink);
    }

    body { display: flex; }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      background: var(--white);
      color: var(--ink);
      border: 1px solid var(--sidebar-pill-border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 24px;
      width: fit-content;
      transition: all 0.2s;
    }
    .back-btn:hover { background: var(--sidebar-pill-bg); }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--ink);
    }
    .tagline {
      font-size: 12px;
      color: var(--sidebar-muted);
      margin-bottom: 24px;
      display: block;
    }

    .divider {
      height: 1px;
      background: var(--sidebar-border);
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sidebar-muted);
      margin-bottom: 8px;
    }
    .format-hint {
      font-size: 11px;
      color: var(--sidebar-muted);
      margin-bottom: 16px;
    }

    .upload-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choose {
      display: block;
      background: var(--white);
      border: 1px solid var(--sidebar-pill-border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-choose:hover { background: var(--sidebar-pill-bg); }

    .btn-upload {
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-upload:hover { opacity: 0.9; }
    .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg {
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .file-pill {
      display: inline-flex;
      align-items: center;
      background: var(--sidebar-pill-bg);
      border: 1px solid var(--sidebar-pill-border);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      margin-top: 12px;
      max-width: 100%;
    }
    .file-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sidebar-footer {
      margin-top: auto;
      font-size: 11px;
      color: var(--sidebar-muted);
      text-align: center;
    }

    /* MAIN AREA */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .top-bar {
      height: 64px;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; }
    .top-bar-brand { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; }
    .mode-badge {
      background: var(--sidebar-pill-bg);
      color: var(--ink);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
    }
    .messages-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .msg-row { display: flex; gap: 16px; margin-bottom: 24px; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .avatar.bot { background: var(--sidebar-pill-bg); }
    .avatar.user { background: var(--ink); color: var(--white); font-size: 13px; font-weight: 600; }

    .bubble {
      padding: 14px 20px;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.6;
    }
    .bubble.bot {
      background: var(--bot-bubble-bg);
      border: 1px solid var(--bot-bubble-border);
      border-radius: 0 20px 20px 20px;
    }
    .bubble.user {
      background: var(--ink);
      color: var(--white);
      border-radius: 20px 0 20px 20px;
    }

    .input-area {
      padding: 24px 32px;
      border-top: 1px solid var(--sidebar-border);
    }
    .input-wrapper {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #chat-input {
      flex: 1;
      background: var(--sidebar-bg);
      border: 1px solid var(--sidebar-border);
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    #chat-input:focus { border-color: var(--blue-rich); }

    .send-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--ink); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .send-btn:hover { background: var(--blue-rich); }

    /* Typing Dots */
    .typing { display: none; gap: 4px; padding: 12px 0; }
    .typing.active { display: flex; }
    .dot { width: 8px; height: 8px; background: var(--blue-rich); border-radius: 50%; animation: bounce 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    /* MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        z-index: 1000;
        transition: left 0.3s ease;
      }
      .sidebar.active {
        left: 0;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.3);
        z-index: 999;
      }
      .sidebar-overlay.active { display: block; }

      .menu-btn {
        display: flex !important;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: var(--sidebar-bg);
        border: 1px solid var(--sidebar-border);
        border-radius: 8px;
        cursor: pointer;
        margin-right: 10px;
      }

      .top-bar { padding: 0 16px; height: 56px; }
      .messages-wrapper { padding: 0 16px; }
      .bubble { max-width: 85%; }
      .input-area { padding: 12px 16px; }
    }

    .menu-btn { display: none; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="/ask" class="back-btn">← Back</a>
    
    <div class="brand-row">
      <div id="sidebar-jelly"></div>
      <span class="brand-name">Resh</span>
    </div>
    <span class="tagline">Sharp answers. Real knowledge.</span>
    
    <div class="divider"></div>
    
    <div class="section-label">Upload a file</div>
    <p class="format-hint">PDF, DOCX, TXT, PPTX</p>
    
    <div class="upload-container">
      <input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.docx,.pptx">
      <label for="fileInput" class="btn-choose" id="fileLabel">Choose file</label>
      <button class="btn-upload" id="uploadBtn">Upload & index</button>
      
      <div id="uploadStatus" class="status-msg"></div>
      
      <div id="filePill" class="file-pill" style="display:none">
        <span id="pillName"></span>
      </div>
      
      <div id="resetUpload" style="display:none; margin-top:8px;">
        <button onclick="resetUploadSection()" style="background:none; border:none; color:var(--sidebar-muted); font-size:11px; cursor:pointer; text-decoration:underline; padding:0;">Upload different file</button>
      </div>
    </div>

    <div class="sidebar-footer"></div>
  </aside>

  <main class="main-content">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="menu-btn" id="menuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div id="topbar-jelly" style="display: flex; align-items: center; justify-content: center;"></div>
        <span class="top-bar-brand">Resh</span>
      </div>
      <div class="mode-badge">Chat with file</div>
    </div>

    <div class="messages-container" id="messages-container">
      <div class="messages-wrapper" id="chat-messages">
        <div class="msg-row bot" id="welcome-msg">
          <!-- Initialized by script -->
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="chat-input" placeholder="Ask Resh about the file..." autocomplete="off">
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script>
    function jellyfishSVG(w, h) {
      return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">'
      +
      '<ellipse cx="20" cy="18" rx="18" ry="14" fill="rgba(91,163,201,0.25)" stroke="rgba(91,163,201,0.85)" stroke-width="1.2"/>'
      +
      '<ellipse cx="20" cy="18" rx="14" ry="10" fill="rgba(255,255,255,0.15)"/>'
      +
      '<ellipse cx="14" cy="12" rx="6" ry="4" fill="rgba(255,255,255,0.55)"/>'
      +
      '<ellipse cx="23" cy="15" rx="2.5" ry="1.8" fill="rgba(255,255,255,0.35)"/>'
      +
      '<ellipse cx="20" cy="20" rx="10" ry="6" fill="rgba(58,143,191,0.12)"/>'
      +
      '<ellipse cx="20" cy="28" rx="18" ry="4" fill="rgba(91,163,201,0.15)" stroke="rgba(91,163,201,0.45)" stroke-width="0.8"/>'
      +
      '<ellipse cx="20" cy="27" rx="12" ry="2" fill="rgba(255,255,255,0.2)"/>'
      +
      '<circle cx="15" cy="17" r="2" fill="#1A3A4A"/>'
      +
      '<circle cx="25" cy="17" r="2" fill="#1A3A4A"/>'
      +
      '<circle cx="15.8" cy="16.2" r="0.7" fill="white"/>'
      +
      '<circle cx="25.8" cy="16.2" r="0.7" fill="white"/>'
      +
      '<path d="M 15 21 Q 20 24.5 25 21" stroke="#2A6A8B" stroke-width="0.9" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 7 30 C 4 35 10 39 7 44 C 4 47 8 49 7 51" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 11 31 C 8 36 14 40 11 45 C 8 48 12 50 11 52" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 15 32 C 12 37 18 41 15 46 C 12 49 16 51 15 52" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 20 32 C 17 38 23 42 20 47 C 17 50 21 52 20 52" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 25 32 C 22 37 28 41 25 46 C 22 49 26 51 25 52" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 29 31 C 26 36 32 40 29 45 C 26 48 30 50 29 52" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '<path d="M 33 30 C 30 35 36 39 33 44 C 30 47 34 49 33 51" stroke="rgba(58, 143, 191, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
      +
      '</svg>';
    }

    // Initialize svgs — must run after DOM is ready
    // Base URL for API calls (works on Railway and local)
    const baseUrl = window.location.origin;
    function initJellyfish() {
      document.getElementById('sidebar-jelly').innerHTML = jellyfishSVG(40, 52);
      const topbarJelly = document.getElementById('topbar-jelly');
      if (topbarJelly) {
        topbarJelly.innerHTML = jellyfishSVG(24, 31);
      }
    }

    // Mobile Sidebar Logic
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    function toggleSidebar() {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    let fileUploaded = false;
    let activeUploadedFile = "";

    document.getElementById('fileInput').addEventListener('change', function() {
        const label = document.getElementById('fileLabel');
        if (this.files && this.files[0]) {
            const name = this.files[0].name;
            label.textContent = name.length > 20 ? name.substring(0, 20) + '...' : name;
        } else {
            label.textContent = 'Choose file';
        }
    });

    document.getElementById('uploadBtn').addEventListener('click', async function() {
        const fileInput = document.getElementById('fileInput');
        const statusEl = document.getElementById('uploadStatus');
        const pillEl = document.getElementById('filePill');
        const pillName = document.getElementById('pillName');
        const uploadBtn = document.getElementById('uploadBtn');
        const resetLink = document.getElementById('resetUpload');

        if (!fileInput.files || fileInput.files.length === 0) {
            statusEl.textContent = 'Please choose a file first.';
            statusEl.style.color = '#C62828';
            return;
        }

        fileUploaded = false;
        statusEl.textContent = 'Uploading...';
        statusEl.style.color = 'var(--sidebar-muted)';
        pillEl.style.display = 'none';
        resetLink.style.display = 'none';
        uploadBtn.disabled = true;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const res = await fetch(window.location.origin + '/upload', { method: 'POST', body: formData, cache: 'no-store' });
            const data = await res.json();
            if (data.success) {
                fileUploaded = true;
                activeUploadedFile = data.filename;
                statusEl.textContent = '✓ File ready.';
                statusEl.style.color = '#2E7D32';
                pillEl.style.display = 'inline-flex';
                pillName.textContent = "📄 " + data.filename;
                fileInput.value = '';
                document.getElementById('fileLabel').textContent = 'Choose file';
                resetLink.style.display = 'block';
            } else {
                statusEl.textContent = '✗ ' + (data.error || 'Upload failed.');
                statusEl.style.color = '#C62828';
            }
        } catch (err) {
            statusEl.textContent = '✗ Connection error.';
            statusEl.style.color = '#C62828';
        } finally {
            uploadBtn.disabled = false;
        }
    });

    function resetUploadSection() {
        fileUploaded = false;
        activeUploadedFile = "";
        document.getElementById('fileInput').value = '';
        document.getElementById('fileLabel').textContent = 'Choose file';
        document.getElementById('uploadStatus').textContent = '';
        document.getElementById('filePill').style.display = 'none';
        document.getElementById('resetUpload').style.display = 'none';
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if(!text) return;
      if(!fileUploaded) {
        addMessage("bot", "Please upload a file first.");
        input.value = "";
        return;
      }
      addMessage("user", text);
      input.value = "";
      
      const container = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'msg-row bot';
      typingDiv.innerHTML = `<div class="avatar bot">${jellyfishSVG(18, 23)}</div><div class="bubble bot"><div class="typing active"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
      container.appendChild(typingDiv);
      scrollToBottom();
      
      try {
        const res = await fetch(window.location.origin + '/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message: text, mode: "upload"}),
          cache: 'no-store'
        });
        const data = await res.json();
        container.removeChild(typingDiv);
        addMessage("bot", data.response);
      } catch(e) {
        container.removeChild(typingDiv);
        addMessage("bot", "Error connecting to Resh.");
      }
    }

    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `msg-row ${sender}`;
      const avatar = sender === 'bot' ? `
        <div class="avatar bot">${jellyfishSVG(18, 23)}</div>
      ` : `
        <div class="avatar user">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      `;
      div.innerHTML = `${avatar}<div class="bubble ${sender}">${text}</div>`;
      document.getElementById('chat-messages').appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage(); });

    // Initialize welcome
    window.onload = () => {
      initJellyfish();
      document.getElementById('welcome-msg').innerHTML = `
        <div class="avatar bot">${jellyfishSVG(18, 23)}</div>
        <div class="bubble bot">Hi! Upload a document on the left and I will answer your questions about it instantly.</div>
      `;
    };
  </script>
</body>
</html>
